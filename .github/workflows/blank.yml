name: Build Android Production Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Build Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies & Bundle Web Assets
        run: |
          npm install
          npm run build

      - name: Generate Local Mobile Directory Path
        run: |
          mkdir -p android/app/src/main

      - name: Create Production Android Manifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              package="com.partsforge.app">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="PartsForge"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name="com.partsforge.app.MainActivity"
                      android:exported="true"
                      android:label="PartsForge"
                      android:launchMode="singleTop">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

      - name: Inject Android Project Configuration Blueprint
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.partsforge.app",
            "appName": "PartsForge",
            "webDir": "dist"
          }
          EOF

      - name: Initialize Capacitor Platform Assemblies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap soccer || true
          npx cap add android || true
          npx cap sync android

      - name: Compile Official Android App Bundle (.aab)
        run: |
          cd android && ./gradlew bundleRelease

      - name: Upload Final Build Artifact to Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: partsforge-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
